<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Page not found - Before Leaving">
    <title>404 - Page Not Found | Before Leaving</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="stylesheet" href="/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Smart App Banner for iOS -->
    <meta name="apple-itunes-app" content="app-id=719622441">
    
    <script>
        (function() {
            var path = window.location.pathname;
            var travelMatch = path.match(/^\/travel\/join\/([A-Za-z0-9]+)\/?$/);
            var groupMatch = path.match(/^\/join\/([A-Za-z0-9]+)\/?$/);

            if (travelMatch) {
                window.location.replace(
                    '/join.html?type=travel&code=' + encodeURIComponent(travelMatch[1])
                );
            } else if (groupMatch) {
                window.location.replace(
                    '/join.html?type=group&code=' + encodeURIComponent(groupMatch[1])
                );
            }
        })();
    </script>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar scrolled">
        <div class="nav-container">
            <a href="/" class="nav-logo">
                <img src="/images/app-icon.png" alt="Before Leaving" class="nav-icon">
                <span class="logo-text">Before Leaving</span>
            </a>
            <div class="nav-links">
                <a href="/" class="nav-link">Home</a>
                <a href="/faq.html" class="nav-link">FAQ</a>
                <a href="/privacy.html" class="nav-link">Privacy</a>
                <a href="/terms.html" class="nav-link">Terms</a>
                <a href="/#contact" class="nav-link">Contact</a>
            </div>
            <button class="nav-toggle" aria-label="Toggle navigation">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </nav>

    <!-- 404 Content -->
    <main class="error-page">
        <div class="error-content" id="error-content">
            <h1>404</h1>
            <h2>Oops! Page Not Found</h2>
            <p>Looks like you forgot this page... before leaving! 🎒</p>
            <p>The page you're looking for doesn't exist or has been moved.</p>
            <div style="margin-top: 32px; display: flex; gap: 16px; justify-content: center; flex-wrap: wrap;">
                <a href="/" class="btn btn-primary">Go Home</a>
                <a href="/faq.html" class="btn btn-secondary">View FAQ</a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer" style="position: absolute; bottom: 0; width: 100%;">
        <div class="container">
            <div class="footer-bottom" style="border: none; padding-top: 0;">
                <p>&copy; 2013-2026 Shady Ghalab. All rights reserved.</p>
                <p class="footer-made">Made with ❤️ for iOS</p>
            </div>
        </div>
    </footer>

    <script>
        // Mobile navigation toggle
        document.querySelector('.nav-toggle').addEventListener('click', function() {
            document.querySelector('.nav-links').classList.toggle('active');
            this.classList.toggle('active');
        });
    </script>
</body>
</html>
